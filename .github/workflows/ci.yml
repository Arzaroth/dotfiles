name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SHELLCHECK_VERSION: v0.11.0
  SHFMT_VERSION: v3.14.1

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install ShellCheck
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | tar -xJ
          sudo install -m 0755 "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck

      - name: Lint shell package
        run: |
          set -euo pipefail
          git ls-files shell | xargs shellcheck

  shfmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install shfmt
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/shfmt "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt

      - name: Check shell formatting
        run: |
          set -euo pipefail
          git ls-files shell | xargs shfmt --diff

  zsh-syntax:
    name: Zsh syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Zsh
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh

      - name: Parse Zsh files
        run: |
          set -euo pipefail
          git ls-files zsh | grep -E '(\.zsh|/\.zshrc|/\.zshenv)$' | while read -r file; do
            echo "zsh -n $file"
            zsh -n "$file"
          done

  stow:
    name: Stow deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install GNU Stow
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends stow

      - name: Simulate deployment
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/home"
          mkdir -p "$target"
          stow --no --verbose --target "$target" $(make list)

  smoke:
    name: Interactive shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Zsh and GNU Stow
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh stow

      - name: Deploy into a throwaway HOME
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/home"
          mkdir -p "$target/bin" "$target/.local/bin"
          stow --target "$target" $(make list)

      - name: Stub out Antidote and tpm
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/home"
          mkdir -p "$target/.antidote" "$target/.tmux/plugins/tpm"
          printf 'antidote() { : }\n' > "$target/.antidote/antidote.zsh"

      - name: Start an interactive shell
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/home"
          HOME="$target" ZDOTDIR="$target" zsh -d -i -c exit 2>"$RUNNER_TEMP/stderr.log"
          # `zsh -i` without a terminal cannot enable ZLE, so anything
          # installing line-editor widgets complains.
          grep -v "can't change option: zle" "$RUNNER_TEMP/stderr.log" \
            > "$RUNNER_TEMP/unexpected.log" || true
          if [ -s "$RUNNER_TEMP/unexpected.log" ]; then
            echo "interactive startup wrote to stderr:" >&2
            cat "$RUNNER_TEMP/unexpected.log" >&2
            exit 1
          fi

      - name: The antidote command is available in an interactive shell
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/home"
          HOME="$target" ZDOTDIR="$target" zsh -d -i -c 'whence -w antidote' 2>/dev/null \
            | grep -q 'antidote: function'

      - name: PATH must not grow in nested shells
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/home"
          run() { HOME="$target" ZDOTDIR="$target" zsh -d -i -c "$1" 2>/dev/null; }
          outer=$(run 'print -r -- $PATH')
          inner=$(run 'zsh -d -i -c "print -r -- \$PATH"')
          if [ "$outer" != "$inner" ]; then
            printf 'outer: %s\ninner: %s\n' "$outer" "$inner" >&2
            exit 1
          fi

      - name: A failed bundle regeneration must keep the working bundle
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/home"
          printf 'GOOD=1\n' > "$target/.zsh_plugins.zsh"
          touch -d '2000-01-01' "$target/.zsh_plugins.zsh"
          printf 'antidote() { return 1 }\n' > "$target/.antidote/antidote.zsh"
          HOME="$target" ZDOTDIR="$target" zsh -d -i -c exit 2>/dev/null || true
          grep -q 'GOOD=1' "$target/.zsh_plugins.zsh"

      - name: A failed first-login clone must leave nothing behind
        run: |
          set -euo pipefail
          fresh="$RUNNER_TEMP/fresh"
          mkdir -p "$fresh/fakebin"
          stow --target "$fresh" $(make list)
          printf '#!/bin/sh\nfor a; do d=$a; done\nmkdir -p "$d" && touch "$d/partial"\nexit 1\n' \
            > "$fresh/fakebin/git"
          chmod +x "$fresh/fakebin/git"
          PATH="$fresh/fakebin:$PATH" HOME="$fresh" ZDOTDIR="$fresh" zsh -d -i -c exit 2>/dev/null
          test ! -e "$fresh/.antidote"
          test ! -e "$fresh/.tmux/plugins/tpm"
          ! ls -d "$fresh"/.antidote.*.tmp "$fresh"/.tmux/plugins/tpm.*.tmp 2>/dev/null
